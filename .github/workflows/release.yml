name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag (e.g. after a partial failure):
  # dispatch this workflow selecting the TAG as the ref. The job guard below
  # refuses branch refs — GoReleaser needs a tag checkout.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC, to assume the release role

env:
  # releases.driverforge.com is CloudFront in front of this bucket; every path
  # keeps the `driverforge-releases/` segment the URLs have always had.
  RELEASES_BUCKET: driverforge-prod-releases
  RELEASES_PREFIX: driverforge-releases
  ARTIFACT_PATH: gayle

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The bot app key lives as a secret of the `release` environment, whose
    # deployment policy only admits v* tag refs — a tampered workflow on a
    # branch or PR can never see it. gayle is a public repo; the app private
    # key must not be in plain repo/org scope. The same environment is what the
    # AWS release role trusts: its OIDC subject must be
    # repo:driverforge/gayle:environment:release.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Short-lived installation token for pushing the Homebrew cask and Scoop
      # manifest — the workflow's own GITHUB_TOKEN can't write outside this repo.
      # Minted from the driverforge-bot GitHub App (client id is a repo
      # variable; the private key is a `release` ENVIRONMENT secret), scoped to
      # exactly the two tap repos, valid for one hour. The app's installation
      # must cover both tap repos with Contents read/write.
      - name: Mint tap token from driverforge-bot
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DRIVERFORGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DRIVERFORGE_BOT_PRIVATE_KEY }}
          owner: driverforge
          repositories: |
            homebrew-tap
            scoop-bucket

      # The release role (driverforge monorepo, infra/platform
      # release-publishers.ts) may write under driverforge-releases/gayle/ and
      # nothing else, and cannot delete. Its ARN is a repo variable:
      #   pulumi stack output releasePublisherRoles  → .gayle
      # Assumed before anything is published, so a broken trust fails the
      # release while failing is still free.
      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Pin the tag GoReleaser releases. When an rc and its stable tag
          # point at the same commit (no changes between them), GoReleaser's
          # current-tag guess can pick the wrong one — the v6.0.0 run once
          # built rc1 artifacts and tried to upload them to the immutable rc
          # release. The workflow's ref IS the tag (guarded above).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Creates the (internal/mirror) release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask/manifest to homebrew-tap and scoop-bucket (see above).
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          # macOS signing + notarization. Keep these COMMENTED OUT until the secrets exist:
          # GitHub exports a missing secret as an empty string, which would still flip
          # `isEnvSet` on and break the release. Uncomment all five once the secrets are
          # added (Developer ID .p12 + App Store Connect .p8 API key, both base64-encoded).
          # MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          # MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          # MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # GoReleaser uploaded the versioned archives + checksums to S3. This step
      # publishes the release manifest — to both the immutable versioned path and
      # the mutable `latest/` pointer — mirroring the driverforge CLI pipeline
      # (same schema: version/tag/commit/releasedAt/artifacts).
      - name: Publish release manifest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DEST="s3://$RELEASES_BUCKET/$RELEASES_PREFIX/$ARTIFACT_PATH"
          BASE_URL="https://releases.driverforge.com/$RELEASES_PREFIX/$ARTIFACT_PATH/$TAG"

          # Build the artifacts[] array from the archives GoReleaser produced.
          artifacts="$(cd dist && for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            jq -n --arg n "$f" --arg u "$BASE_URL/$f" '{name: $n, url: $u}'
          done | jq -s '.')"

          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson artifacts "$artifacts" \
            '{version: $version, tag: $tag, commit: $commit, releasedAt: $releasedAt, artifacts: $artifacts}' \
            > manifest.json

          aws s3 cp manifest.json "$DEST/$TAG/manifest.json" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"

          # The mutable latest/ pointer only ever advances to STABLE
          # releases — a prerelease (v6.0.0-rc1) publishes its own versioned
          # manifest above but must not become "latest".
          case "$VERSION" in
            *-*)
              echo "prerelease $VERSION: leaving latest/manifest.json untouched"
              ;;
            *)
              aws s3 cp manifest.json "$DEST/latest/manifest.json" \
                --content-type application/json \
                --cache-control "no-cache, must-revalidate"
              ;;
          esac
